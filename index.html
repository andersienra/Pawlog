<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
</head><body>
<title>Pawlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pawlog">
<meta name="theme-color" content="#F3F5EF">
<meta name="description" content="A daily behavior logbook for your dog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap">
<style>
/* Layout: iOS grouped-list app — sticky top bar, one column (max 560px), frosted tab bar fixed to the bottom.
   Palette: "collar green" accent on leaf-tinted neutrals, honey for highlights, coral/green reserved for good/rough. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --surface-2: #E9EEE6;
  --surface-3: #DDE4D9;
  --ink: #17201B;
  --ink-2: #4C5851;
  --ink-3: #7F8B84;
  --line: #DEE4DA;
  --accent: #1D6A55;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAEDE4;
  --honey: #CF8A22;
  --honey-soft: #FBEBCF;
  --good: #2F8F5B;
  --bad: #D2563D;
  --neutral: #CBD2C7;
  --warn: #B87512;
  --scrim: rgba(12, 20, 16, .42);
  --tab-bg: rgba(250, 251, 248, .84);
  --shadow: 0 1px 1px rgba(23, 40, 30, .04), 0 6px 20px rgba(23, 40, 30, .06);
  --shadow-lg: 0 -8px 40px rgba(12, 24, 18, .18);
  --font-display: "Bricolage Grotesque", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1311;
    --surface: #171E1B;
    --surface-2: #222B27;
    --surface-3: #2C3732;
    --ink: #E8EEE9;
    --ink-2: #A8B4AD;
    --ink-3: #6F7C75;
    --line: #27312C;
    --accent: #5EC3A1;
    --accent-ink: #08170F;
    --accent-soft: #19362C;
    --honey: #EDB257;
    --honey-soft: #362812;
    --good: #5DC48B;
    --bad: #EE7B62;
    --neutral: #3A4540;
    --warn: #E8AA4E;
    --scrim: rgba(0, 0, 0, .6);
    --tab-bg: rgba(20, 26, 23, .84);
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1311;
  --surface: #171E1B;
  --surface-2: #222B27;
  --surface-3: #2C3732;
  --ink: #E8EEE9;
  --ink-2: #A8B4AD;
  --ink-3: #6F7C75;
  --line: #27312C;
  --accent: #5EC3A1;
  --accent-ink: #08170F;
  --accent-soft: #19362C;
  --honey: #EDB257;
  --honey-soft: #362812;
  --good: #5DC48B;
  --bad: #EE7B62;
  --neutral: #3A4540;
  --warn: #E8AA4E;
  --scrim: rgba(0, 0, 0, .6);
  --tab-bg: rgba(20, 26, 23, .84);
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid color-mix(in oklab, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; }

#app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: var(--gut-l);
  padding-right: var(--gut-r);
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
#app.no-tabs { padding-block-end: 40px; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin-left: calc(-1 * var(--gut-l));
  margin-right: calc(-1 * var(--gut-r));
  padding: 10px var(--gut-r) 10px var(--gut-l);
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.5) blur(16px);
  backdrop-filter: saturate(1.5) blur(16px);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 60px;
}
.topbar h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -.02em;
  margin: 0;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-variation-settings: "opsz" 48;
}
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-grid; place-items: center;
  color: var(--ink-2);
  flex: none;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; min-height: 44px; padding-right: 8px; margin-left: -8px; }
.back-btn svg { width: 26px; height: 26px; }

.dog-chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 4px 12px 4px 4px;
  border-radius: 999px; background: var(--surface);
  box-shadow: var(--shadow);
  max-width: 60%;
  min-width: 0;
}
.dog-chip .nm { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dog-chip svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.avatar {
  flex: none; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center;
  color: #fff; font-family: var(--font-display); font-weight: 800;
  background: var(--accent);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.savestate { font-size: 13px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; min-width: 64px; justify-content: flex-end; transition: opacity .3s; }
.savestate svg { width: 14px; height: 14px; }
.savestate.err { color: var(--bad); }
.streak {
  display: inline-flex; align-items: center; gap: 4px;
  font-weight: 700; font-size: 14px;
  padding: 6px 10px; border-radius: 999px;
  background: var(--honey-soft); color: var(--honey);
}
.streak svg { width: 15px; height: 15px; }

/* ---------- Banner / toast ---------- */
.banner {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 0 8px; padding: 8px 6px 8px 14px;
  border-radius: var(--r-md);
  background: var(--honey-soft); color: var(--ink);
  font-size: 14px;
}
.banner p { margin: 0; flex: 1; min-width: 0; }
.banner .icon-btn { width: 36px; height: 36px; }
.banner .icon-btn svg { width: 18px; height: 18px; }
#toast {
  position: fixed; left: 50%; z-index: 80;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 500;
  max-width: min(92vw, 420px); width: max-content; text-align: center;
  transition: opacity .25s, transform .25s;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--bad); color: #fff; }

/* ---------- Tabs ---------- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--tab-bg);
  -webkit-backdrop-filter: saturate(1.6) blur(20px);
  backdrop-filter: saturate(1.6) blur(20px);
  border-top: 1px solid var(--line);
  padding: 4px var(--gut-r) calc(4px + env(safe-area-inset-bottom, 0px)) var(--gut-l);
}
#tabs .inner { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
.tab {
  min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--ink-3);
}
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--accent); }

/* ---------- Generic blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 22px; padding-top: 4px; }
.group-label {
  font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); margin: 0 4px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.group-label .aside { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; white-space: nowrap; flex: none; }
.group-label > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel.pad { padding: 16px; }
.rows > * + * { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; min-height: 52px; width: 100%; text-align: left;
}
button.row:active, .row.tap:active { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
h2.display { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; margin: 0; text-wrap: balance; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: 14px;
  font-weight: 650; font-size: 17px;
  background: var(--accent); color: var(--accent-ink);
  transition: transform .12s, filter .12s;
}
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.block { width: 100%; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: color-mix(in oklab, var(--bad) 14%, var(--surface)); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.btn svg { width: 20px; height: 20px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.linkbtn { color: var(--accent); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.linkbtn svg { width: 18px; height: 18px; }

.empty {
  text-align: center; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty .art { width: 84px; height: 84px; color: var(--accent); opacity: .9; }
.empty h3 { font-family: var(--font-display); font-weight: 650; font-size: 21px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--ink-2); max-width: 30ch; }

/* ---------- Today ---------- */
.datebar { display: flex; align-items: center; gap: 4px; margin: 2px 0 2px; }
.datebar .icon-btn { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.datebar .icon-btn[disabled] { opacity: .35; pointer-events: none; }
.datebar .when { flex: 1; position: relative; text-align: center; min-height: 54px; display: flex; flex-direction: column; justify-content: center; border-radius: var(--r-md); }
.datebar .when .big { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; }
.datebar .when .sub { font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; justify-content: center; }
.datebar .when .sub svg { width: 14px; height: 14px; }
.datebar .when input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; border: 0; }
.jump-today { align-self: center; font-size: 13px; font-weight: 650; color: var(--accent); background: var(--accent-soft); padding: 6px 12px; border-radius: 999px; min-height: 32px; }

.summary { display: flex; align-items: center; gap: 16px; padding: 16px; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
.ring .v small { display: block; font-family: var(--font-body); font-size: 10px; font-weight: 650; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; text-align: center; margin-top: -2px; }
.summary .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.summary .word { font-family: var(--font-display); font-weight: 650; font-size: 22px; letter-spacing: -.01em; }
.summary .meta { font-size: 14px; color: var(--ink-2); }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.reminder {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--honey-soft); width: 100%; text-align: left; min-height: 52px;
}
.reminder.overdue { background: color-mix(in oklab, var(--bad) 14%, var(--surface)); }
.reminder .ic { font-size: 22px; line-height: 1; }
.reminder .t { font-weight: 600; }
.reminder .s { font-size: 13px; color: var(--ink-2); }

.bcard { padding: 14px 16px 10px; --c: var(--ink-3); --p: 50%; }
.bhead { display: flex; align-items: center; gap: 10px; }
.bemoji { font-size: 22px; width: 30px; text-align: center; line-height: 1; flex: none; }
.bname { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bval {
  font-family: var(--font-display); font-weight: 800; font-size: 22px; min-width: 44px; text-align: right;
  color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.bval small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.bcard.unset .bval { color: var(--ink-3); font-size: 14px; font-family: var(--font-body); font-weight: 600; }
.bclear { font-size: 13px; color: var(--ink-3); min-height: 32px; padding: 0 6px; }
.blabels { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-3); margin-top: -2px; }
.blabels span:last-child { text-align: right; }

.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 2px 0 0; display: block; cursor: pointer; }
.slider:focus-visible { outline: none; }
.slider::-webkit-slider-runnable-track {
  height: 12px; border-radius: 99px;
  background: linear-gradient(to right, var(--c) 0 var(--p), var(--surface-2) var(--p) 100%);
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--c);
  margin-top: -11px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  transition: transform .12s;
}
.slider:active::-webkit-slider-thumb { transform: scale(1.12); }
.slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px color-mix(in oklab, var(--c) 35%, transparent); }
.slider::-moz-range-track { height: 12px; border-radius: 99px; background: var(--surface-2); }
.slider::-moz-range-progress { height: 12px; border-radius: 99px; background: var(--c); }
.slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.bcard.unset .slider::-webkit-slider-runnable-track { background: var(--surface-2); }
.bcard.unset .slider::-webkit-slider-thumb { border-color: var(--surface-3); background: var(--surface); }
.bcard.unset .slider::-moz-range-progress { background: transparent; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); color: var(--ink); font-size: 15px; font-weight: 500;
  border: 1.5px solid transparent;
  transition: background .15s, color .15s;
}
.chip svg { width: 14px; height: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.add { background: transparent; border-color: var(--line); border-style: dashed; color: var(--ink-2); }
.chip.static { min-height: 28px; padding: 0 10px; font-size: 13px; }
.evtypes label { position: relative; }
.evtypes input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.evtypes input:checked + .chip { background: var(--accent); color: var(--accent-ink); }
.evtypes input:focus-visible + .chip { outline: 3px solid color-mix(in oklab, var(--accent) 55%, transparent); }
.tag-input { display: flex; gap: 8px; margin-top: 10px; }
.tag-input input { flex: 1; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .flabel { font-size: 13px; font-weight: 650; color: var(--ink-2); letter-spacing: .01em; }
.input, textarea.input, select.input {
  width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--accent); }
input[type="date"].input { display: block; min-width: 0; text-align: left; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
textarea.input { resize: none; min-height: 110px; line-height: 1.45; }
.notes-area { border: 0; padding: 14px 16px; background: transparent; min-height: 120px; border-radius: var(--r-lg); }
.notes-area:focus { border: 0; }
.form { display: flex; flex-direction: column; gap: 16px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .two > * { min-width: 0; }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg label, .seg button { flex: 1; position: relative; min-width: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span, .seg button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  min-height: 40px; padding: 4px 6px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--ink-2);
  transition: background .15s, color .15s;
}
.seg span small { font-size: 11px; font-weight: 500; color: var(--ink-3); }
.seg input:checked + span, .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg input:focus-visible + span { outline: 3px solid color-mix(in oklab, var(--accent) 55%, transparent); }

details.more > summary { list-style: none; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .chev { transition: transform .2s; }
details.more[open] > summary .chev { transform: rotate(90deg); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 16px 16px; }
.detail-grid > * { min-width: 0; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 600; display: grid; place-items: center; flex: none; }

  // --- db subscriptions ---

  // "Sam updated today's log" — debounced, only for the day being viewed, never on initial load.
  let remoteToastTimer = null; const remoteWho = new Set();

    remoteWho.add(who);
    clearTimeout(remoteToastTimer);

      const ids = Array.from(remoteWho); remoteWho.clear();
      await resolveNames(ids);
      const names = ids.map(personName);

      toast((names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]) + ' updated ' + day);

  // --- people (ids only in data; names resolved at render time) ---

  async function resolveNames(ids) {

      let changed = false;
      for (const id of ids) {
        const p = ps && ps[id];
        const nm = p ? (p.name || '') : '';
        if (S.names[id] !== nm) { S.names[id] = nm; changed = true; }
        if (p && p.avatarUrl) S.avatars[id] = p.avatarUrl;

    } catch (e) { return false; }

    if (!missing.length || namesPending) return;

    for (const col of SUB_COLS) for (const d of Object.values(S[col])) {
      if (!d) continue;
      add(d.createdBy); add(d.updatedBy);
      if (d.editors) Object.keys(d.editors).forEach(add);

    return Array.from(ids);

  // --- debounced edits & flush ---

  /* =========================================================

    const th = fitJpeg(img, 320, THUMB_BUDGET);

  function authMsg(e) {
    const c = String((e && e.code) || '');

    if (/email-already-in-use/.test(c)) return 'There’s already an account with this email. Sign in instead.';
    if (/weak-password/.test(c)) return 'Choose a stronger password: at least 6 characters.';
    if (/invalid-email/.test(c)) return 'Enter a valid email address, like name@example.com.';
    if (/missing-password/.test(c)) return 'Enter your password.';
    if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes, then try again.';
    if (/network-request-failed/.test(c)) return 'Can’t reach the server. Check your connection and try again.';
    if (/operation-not-allowed|admin-restricted-operation/.test(c)) return 'New accounts are turned off for this Pawlog. Ask the owner to create one for you.';

  async function submitAuth(form) {

    const pw = String(fd.get('password') || '');
    const name = String(fd.get('name') || '').trim();
    AUTH.email = email; AUTH.name = name;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setAuthMsg(authMsg({ code: 'auth/invalid-email' })); $('#au_email').focus(); return; }
    if (AUTH.mode === 'create' && !name) { setAuthMsg('Enter your name so the other person knows who logged what.'); $('#au_name').focus(); return; }
    if (AUTH.mode !== 'reset' && !pw) { setAuthMsg(authMsg({ code: 'auth/missing-password' })); $('#au_pw').focus(); return; }
    const btn = $('#authGo'); AUTH.busy = true; if (btn) { btn.disabled = true; btn.textContent = AUTH.mode === 'reset' ? 'Sending…' : AUTH.mode === 'create' ? 'Creating account…' : 'Signing in…'; }
    setAuthMsg('', '');

      if (AUTH.mode === 'reset') {
        try { await A2.sendPasswordResetEmail(FB.auth, email); }

      } else {

  async function startFirebase(cfg) {
    S.backend = 'firebase';
    let m;
    try { m = await loadFirebase(); }
    catch (e) { renderFbLoadError('Pawlog couldn’t load its sync service. Check your connection, then try again.'); return; }
    FB.m = m;
    try {
      FB.app = m.app.initializeApp(cfg);
      try {
        FB.auth = m.auth.initializeAuth(FB.app, { persistence: [m.auth.indexedDBLocalPersistence, m.auth.browserLocalPersistence] });
      } catch (e) { FB.auth = m.auth.getAuth(FB.app); }

        FB.fs = m.firestore.initializeFirestore(FB.app, { ignoreUndefinedProperties: true, localCache: m.firestore.persistentLocalCache({ tabManager: m.firestore.persistentMultipleTabManager() }) });
      } catch (e) { FB.fs = m.firestore.getFirestore(FB.app); }

        if (FB.user) { try { location.reload(); } catch (e) { /* ignore */ } return; }

      fbSubscribePeople();

      startDb(fbDb);

    });
  }

  /* =========================================================
     Rendering core
     ========================================================= */
  // Live sync: remote changes re-render, but never under the user's fingers.
  //  - If the Today screen is showing and the change is to the open day, patch it in place:
  //    the focused field / dragged slider keep their local value, everything else updates.
  //  - Otherwise, if a field is focused or a slider is being dragged, defer the full render until it's released.
  let renderQueued = false, renderDeferred = false, queuedOpts = {};
  let dragging = null; // slider element being dragged
  function busyElement() {
    const a = document.activeElement;
    if (a && $('#app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'range') return a;
    return null;
  }
  function scheduleRender(opts) {
    opts = opts || {};
    queuedOpts.todayEntry = queuedOpts.todayEntry || !!opts.todayEntry;
    queuedOpts.other = queuedOpts.other || (opts.col && opts.col !== 'entries') || !opts.col;
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      const o = queuedOpts; queuedOpts = {};
      const busy = busyElement();
      const sheetOpen = !$('#sheetRoot').hidden;
      if (S.view === 'today' && !o.other && curDog()) { patchToday(); return; }
      if (busy || dragging) { renderDeferred = true; if (S.view === 'today') patchToday(); return; }
      if (sheetOpen) { renderDeferred = true; return; }
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    });
  }

  // so on leaving the field make it the saved version (the person editing wins).
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (!t || !S.ready || S.readOnly) return;
    const dog = curDog(); if (!dog) return;
    const en = getEntry(dog.id, S.date) || {};
    if (t.id === 'notes' && t.value !== (en.notes || '') && !pendingEdits.has('entries/' + entryId(dog.id, S.date))) editEntry(dog, S.date, { notes: t.value }, { now: true });
  }, true);

  document.addEventListener('pointerup', endDrag, true);
  document.addEventListener('pointercancel', endDrag, true);

  // Update the Today screen from S.entries without rebuilding it.
  function patchToday() {
    const dog = curDog();
    if (!dog || S.view !== 'today' || !$('#summary')) return;
    const e = getEntry(dog.id, S.date) || {};
    const rs = ratingsOf(e);
    for (const card of $$('.bcard[data-bid]')) {
      const bid = card.dataset.bid, b = S.behaviors[bid];
      if (!b) continue;
      const sl = card.querySelector('.slider');
      if (sl === dragging || sl === document.activeElement && dragging) continue;
      const v = rs[bid];
      const isSet = !card.classList.contains('unset');
      const curV = isSet ? Number(sl.value) : undefined;
      if ((typeof v === 'number') === isSet && (v === undefined || v === curV)) continue;
      const wrap = document.createElement('div'); wrap.innerHTML = behaviorCard(b, v);
      card.replaceWith(wrap.firstElementChild);
    }
    const tags = tagsOf(e);
    const chipsBox = $('[data-tagbox]');
    if (chipsBox) {
      const known = $$('.chip[data-tag]', chipsBox).map((c) => c.dataset.tag);
      for (const c of $$('.chip[data-tag]', chipsBox)) c.setAttribute('aria-pressed', String(tags.indexOf(c.dataset.tag) >= 0));
      const missing = tags.filter((t) => known.indexOf(t) < 0);

        const addBtn = chipsBox.querySelector('.chip.add');

      const el = $('#' + fid);
      if (el && el !== document.activeElement) { const want = e[key] != null ? String(e[key]) : ''; if (el.value !== want) el.value = want; }

  }

    if (S.readOnly) return '<div class="banner ro-banner" role="note"><p><b>You can view but not edit.</b> Ask the owner to share with Editor access.</p></div>';
    if (S.mode !== 'local' || lsGet(LS_BANNER) === '1') return '';
    return '<div class="banner" role="note"><p><b>Saved on this device only.</b> Export a backup from Settings now and then.</p><button class="icon-btn" data-action="dismiss-banner" aria-label="Dismiss">' + I.x + '</button></div>';

  /* =========================================================
     Onboarding & dog form
     ========================================================= */
  let formAvatar = null;
  function dogFormFields(d, full) {
    d = d || {};
    const size = d.size || 'medium';
    const sizeSeg = Object.keys(SIZES).map((k) => '<label><input type="radio" name="size" value="' + k + '"' + (size === k ? ' checked' : '') + '><span>' + SIZES[k].label + '<small>' + SIZES[k].hint + '</small></span></label>').join('');
    const sex = d.sex || '';
    const color = d.color || DOG_COLORS[sortedDogs().length % DOG_COLORS.length];
    const sw = DOG_COLORS.map((c) => '<label><input type="radio" name="color" value="' + c + '"' + (color === c ? ' checked' : '') + ' aria-label="Color ' + c + '"><span style="background:' + c + '"></span></label>').join('');
    const unit = d.weightUnit || (/^en-US/i.test(navigator.language || '') ? 'lb' : 'kg');
    let h = '';
    h += '<label class="field"><span>Name</span><input class="input" id="f_name" name="name" required maxlength="40" autocomplete="off" placeholder="e.g. Biscuit" value="' + esc(d.name || '') + '"></label>';
    h += '<label class="field"><span>Breed</span><input class="input" id="f_breed" name="breed" maxlength="60" autocomplete="off" placeholder="e.g. Border Collie mix" value="' + esc(d.breed || '') + '"></label>';
    h += '<div class="two"><label class="field"><span>Birthday</span><input class="input" type="date" id="f_bday" name="birthday" max="' + todayStr() + '" value="' + esc(d.birthday || '') + '"></label>';
    h += '<label class="field"><span>Gotcha day</span><input class="input" type="date" id="f_gotcha" name="gotchaDate" max="' + todayStr() + '" value="' + esc(d.gotchaDate || '') + '"></label></div>';
    h += '<div class="field"><span class="flabel">Size</span><div class="seg" role="radiogroup" aria-label="Size">' + sizeSeg + '</div></div>';
    h += '<div class="two"><div class="field"><span class="flabel">Sex</span><div class="seg" role="radiogroup" aria-label="Sex"><label><input type="radio" name="sex" value="female"' + (sex === 'female' ? ' checked' : '') + '><span>Female</span></label><label><input type="radio" name="sex" value="male"' + (sex === 'male' ? ' checked' : '') + '><span>Male</span></label></div></div>';
    h += '<div class="field"><span class="flabel">Weight in</span><div class="seg" role="radiogroup" aria-label="Weight unit"><label><input type="radio" name="weightUnit" value="kg"' + (unit === 'kg' ? ' checked' : '') + '><span>kg</span></label><label><input type="radio" name="weightUnit" value="lb"' + (unit === 'lb' ? ' checked' : '') + '><span>lb</span></label></div></div></div>';
    h += '<div class="field"><span class="flabel">Color</span><div class="swatches">' + sw + '</div></div>';
    if (full) {
      h += '<label class="field"><span>Microchip number</span><input class="input" id="f_chip" name="microchip" inputmode="numeric" maxlength="30" autocomplete="off" value="' + esc(d.microchip || '') + '"></label>';
      h += '<div class="two"><label class="field"><span>Vet name</span><input class="input" id="f_vet" name="vetName" maxlength="60" value="' + esc((d.vet && d.vet.name) || '') + '"></label>';
      h += '<label class="field"><span>Vet phone</span><input class="input" id="f_vetph" name="vetPhone" type="tel" maxlength="30" value="' + esc((d.vet && d.vet.phone) || '') + '"></label></div>';
      h += '<label class="field"><span>Notes</span><textarea class="input" id="f_dnotes" name="notes" maxlength="2000" placeholder="Allergies, quirks, favorite toys…">' + esc(d.notes || '') + '</textarea></label>';

  }
  function photoPickerField(cur) {
    return '<div class="field"><span class="flabel">Photo <span class="faint">(optional)</span></span><div style="display:flex;align-items:center;gap:14px">' +
      '<span id="formAv">' + avatarHtml({ name: '+', avatarAssetId: cur, color: 'var(--surface-3)' }, 64) + '</span>' +
      '<label for="filePick" class="btn soft sm" data-pick="form">' + I.camera + 'Choose photo</label></div></div>';
  }
  function renderOnboarding() {
    formAvatar = null;
    if (S.readOnly) return '<div class="welcome"><div class="mark">' + PAW + '</div><h1>Nothing logged yet.</h1><p>When the owner adds a dog and starts logging, it shows up here.</p></div>' + bannerHtml();
    return '<div class="welcome"><div class="mark">' + PAW + '</div><h1>Every day with your dog, logged.</h1><p>Rate how the day went in a few swipes, jot a note, add a photo. Pawlog turns it into trends you can actually see.</p></div>' +
      bannerHtml() +
      '<form class="form panel pad" data-form="dog-new" style="margin-top:14px" autocomplete="off"><h2 class="display" style="font-size:22px">Add your dog</h2>' + photoPickerField(null) + dogFormFields(null, false) +
      '<button class="btn block" type="submit">Start logging</button></form>' +
      '<p class="foot">You can add more dogs later in Settings.</p>';
  }
  function readDogForm(form, base) {
    const f = new FormData(form);
    const d = Object.assign({}, base || {});
    d.name = String(f.get('name') || '').trim();
    d.breed = String(f.get('breed') || '').trim();
    d.birthday = isDate(f.get('birthday')) ? f.get('birthday') : null;
    d.gotchaDate = isDate(f.get('gotchaDate')) ? f.get('gotchaDate') : null;
    d.size = String(f.get('size') || 'medium');
    d.sex = String(f.get('sex') || '') || null;
    d.weightUnit = String(f.get('weightUnit') || 'kg');
    d.color = String(f.get('color') || DOG_COLORS[0]);
    if (f.has('microchip')) d.microchip = String(f.get('microchip') || '').trim();
    if (f.has('vetName')) d.vet = { name: String(f.get('vetName') || '').trim(), phone: String(f.get('vetPhone') || '').trim() };
    if (f.has('notes')) d.notes = String(f.get('notes') || '');
    return d;
  }
  function createDog(d) {
    const id = genId('d');
    const dog = Object.assign({ id: id, createdAt: Date.now(), createdBy: S.me || null, avatarAssetId: formAvatar || null, microchip: '', vet: { name: '', phone: '' }, notes: '' }, d);
    if (!canWrite()) return null;
    Store.put('dogs', id, dog);
    DEFAULT_BEHAVIORS.forEach((b, i) => {
      const bid = genId('b');
      Store.put('behaviors', bid, { id: bid, dogId: id, name: b[0], emoji: b[1], lowLabel: b[2], highLabel: b[3], higherIsBetter: b[4], order: i, archived: false });
    });
    setActiveDog(id);
    formAvatar = null;
    return id;
  }
  // Which dog is showing is a per-person choice, kept on this device.
  function setActiveDog(id) { setPref('activeDogId', id || null); }
  function openDogSheet(dogId) {
    const dog = dogId ? S.dogs[dogId] : null;
    formAvatar = dog ? dog.avatarAssetId || null : null;
    const body = '<form class="form" data-form="' + (dog ? 'dog-edit' : 'dog-add') + '" data-id="' + esc(dogId || '') + '" autocomplete="off">' +
      photoPickerField(formAvatar) + dogFormFields(dog, !!dog) +
      '<button class="btn block" type="submit">' + (dog ? 'Save changes' : 'Add dog') + '</button>' +
      (dog ? '<button class="btn block danger" type="button" data-action="delete-dog" data-id="' + esc(dogId) + '">' + I.trash + 'Delete ' + esc(dog.name) + '</button>' : '') +
      '</form>';
    openSheet(dog ? 'Edit ' + dog.name : 'Add a dog', body);
  }

  /* =========================================================
     TODAY
     ========================================================= */
  function dueEvents(dogId, withinDays) {
    const t = todayStr();
    return Object.values(S.events).filter((e) => e && e.dogId === dogId && isDate(e.nextDue) && diffDays(t, e.nextDue) <= withinDays)
      .sort((a, b) => (a.nextDue < b.nextDue ? -1 : 1));
  }
  function dueText(nextDue) {
    const n = diffDays(todayStr(), nextDue);
    if (n < 0) return { cls: 'over', txt: 'Overdue by ' + plural(-n, 'day') };
    if (n === 0) return { cls: 'soon', txt: 'Due today' };
    if (n === 1) return { cls: 'soon', txt: 'Due tomorrow' };
    if (n <= 14) return { cls: 'soon', txt: 'Due in ' + n + ' days' };
    return { cls: '', txt: 'Due ' + fmt(nextDue, { month: 'short', day: 'numeric', year: pd(nextDue).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }) };
  }

  function renderToday(dog) {
    const t = todayStr();
    if (S.date > t) S.date = t;
    const date = S.date;
    const e = getEntry(dog.id, date) || {};
    const bs = dogBehaviors(dog.id);
    const streak = streakFor(dog.id);
    const isToday = date === t;
    const dayDiff = diffDays(date, t);
    const big = isToday ? 'Today' : dayDiff === 1 ? 'Yesterday' : fmt(date, { weekday: 'long' });
    const sub = fmt(date, { month: 'long', day: 'numeric', year: pd(date).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });

    let h = '<header class="topbar"><button class="dog-chip" data-action="switch-dog" aria-label="Switch dog">' + avatarHtml(dog, 34) + '<span class="nm">' + esc(dog.name) + '</span>' + I.chevD + '</button><span class="spacer"></span>' +
      '<span id="savestate" class="savestate" aria-live="polite"></span>' +
      (streak > 0 ? '<span class="streak" title="Days in a row with a log">' + I.flame + '<span class="num">' + streak + '</span></span>' : '') + '</header>';
    h += bannerHtml();
    h += '<div class="stack">';
    h += '<div class="datebar"><button class="icon-btn" data-action="day" data-d="-1" aria-label="Previous day">' + I.chevL + '</button>' +
      '<div class="when"><div class="big">' + esc(big) + '</div><div class="sub">' + I.cal + esc(sub) + '</div>' +
      '<input type="date" id="datePick" aria-label="Pick a date" max="' + t + '" value="' + date + '"></div>' +
      '<button class="icon-btn" data-action="day" data-d="1" aria-label="Next day"' + (isToday ? ' disabled' : '') + '>' + I.chevR + '</button></div>';
    if (!isToday) h += '<button class="jump-today" data-action="goto-today">Back to today</button>';

    const due = dueEvents(dog.id, 7);
    if (due.length && isToday) {
      h += '<div style="display:flex;flex-direction:column;gap:8px">' + due.slice(0, 3).map((ev) => {
        const dt = dueText(ev.nextDue);
        return '<button class="reminder ' + (dt.cls === 'over' ? 'overdue' : '') + '" data-action="edit-event" data-id="' + esc(ev.id) + '"><span class="ic">' + (EVENT_TYPES[ev.type] || EVENT_TYPES.vet).icon + '</span><span class="grow" style="flex:1;min-width:0"><div class="t">' + esc(ev.title || (EVENT_TYPES[ev.type] || EVENT_TYPES.vet).label) + '</div><div class="s">' + esc(dt.txt) + '</div></span>' + '<svg class="chev" style="width:18px;height:18px;color:var(--ink-3)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>';
      }).join('') + '</div>';
    }

    h += '<section class="panel" id="summary">' + summaryInner(dog, e, bs) + '</section>';

    // Behaviors
    h += '<section><div class="group-label"><span>How was ' + esc(dog.name) + '?</span><span class="aside">1–10</span></div><div class="panel rows">';
    if (!bs.length) {
      h += '<div class="empty"><h3>No behaviors to rate</h3><p>Add the things you want to track in Settings.</p><button class="btn soft sm" data-action="tab" data-view="prefs">Open Settings</button></div>';
    }
    const rs = ratingsOf(e);
    for (const b of bs) h += behaviorCard(b, rs[b.id]);
    h += '</div></section>';

    // Tags
    const qt = settings().quickTags || [];
    const tags = tagsOf(e);
    const extra = tags.filter((x) => qt.indexOf(x) < 0);
    h += '<section><div class="group-label"><span>What happened</span></div><div class="panel pad"><div class="chips" data-tagbox>' +
      qt.concat(extra).map((tg) => '<button class="chip" data-action="toggle-tag" data-tag="' + esc(tg) + '" aria-pressed="' + (tags.indexOf(tg) >= 0) + '">' + esc(tg) + '</button>').join('') +
      (S.addingTag || S.readOnly ? '' : '<button class="chip add" data-action="add-tag">' + I.plus + 'Tag</button>') + '</div>' +
      (S.addingTag ? '<form class="tag-input" data-form="tag-new"><input class="input" id="tagNew" name="tag" maxlength="40" placeholder="New tag" autocomplete="off" enterkeyhint="done"><button class="btn sm" type="submit">Add</button><button class="btn sm ghost" type="button" data-action="cancel-tag">Cancel</button></form>' : '') +
      '</div></section>';

    // Notes
    h += '<section><div class="group-label"><span>Notes</span></div><div class="panel"><textarea class="input notes-area" id="notes" data-autogrow maxlength="5000" placeholder="Anything worth remembering? Triggers, wins, what you tried…">' + esc(e.notes || '') + '</textarea></div></section>';

    // Details
    const unit = dog.weightUnit || 'kg';
    const sumBits = [];
    if (e.walkMinutes != null) sumBits.push(e.walkMinutes + ' min walk');
    if (e.weight != null) sumBits.push(e.weight + ' ' + unit);
    if (e.meals != null) sumBits.push(plural(e.meals, 'meal'));
    h += '<section><details class="more panel" id="details"' + (S.detailsOpen ? ' open' : '') + '><summary class="row"><span class="grow"><div class="t">Walk, weight &amp; meals</div><div class="s">' + (sumBits.length ? esc(sumBits.join(' · ')) : 'Optional') + '</div></span>' +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></summary>' +
      '<div class="detail-grid"><label class="field"><span>Walk (minutes)</span><input class="input num" id="walk" type="number" inputmode="numeric" min="0" max="600" step="5" placeholder="0" value="' + esc(e.walkMinutes != null ? e.walkMinutes : '') + '"></label>' +
      '<label class="field"><span>Weight (' + esc(unit) + ')</span><input class="input num" id="weight" type="number" inputmode="decimal" min="0" max="250" step="0.1" placeholder="–" value="' + esc(e.weight != null ? e.weight : '') + '"></label>' +
      '<div class="field" style="grid-column:1/-1"><span class="flabel">Meals</span><div class="stepper"><button type="button" data-action="meals" data-d="-1" aria-label="One fewer meal">−</button><div class="v num" id="mealsV">' + esc(e.meals != null ? e.meals : '–') + '</div><button type="button" data-action="meals" data-d="1" aria-label="One more meal">+</button></div></div></div></details></section>';

    // Photos
    h += '<section><div class="group-label"><span>Photos</span></div><div class="panel">' + photoGridHtml(e) + '</div></section>';

    const bl = byLine(getEntry(dog.id, date));
    h += '<p class="byline" id="byline" aria-live="polite">' + esc(bl) + '</p>';
    if (isLogged(getEntry(dog.id, date)) && !S.readOnly) h += '<div style="text-align:center"><button class="linkbtn" style="color:var(--bad)" data-action="clear-day">' + I.trash + 'Clear this day</button></div>';
    h += '</div>';
    return h;
  }
  function photoGridHtml(e) {
    const ph = photosOf(e);
    const sub = S.date;
    return '<div class="photos" id="photoGrid" data-ids="' + esc(ph.join(',')) + '">' +
      ph.map((id, i) => '<div class="ph"><button class="open" data-action="lightbox-entry" data-i="' + i + '" aria-label="Open photo">' + imgTag(id, 'Photo from ' + sub) + '</button>' + (S.readOnly ? '' : '<button class="rm" data-action="rm-photo" data-id="' + esc(id) + '" aria-label="Remove photo">' + I.x + '</button>') + '</div>').join('') +
      Array.from({ length: S.uploading }).map(() => '<div class="ph loading"></div>').join('') +
      (S.readOnly ? (ph.length ? '' : '<p class="small muted" style="margin:4px;grid-column:1/-1">No photos for this day.</p>') : '<label for="filePick" class="ph add" data-pick="entry">' + I.camera + '<span>Add</span></label>') + '</div>';
  }
  function summaryInner(dog, e, bs) {
    const score = entryScore(Object.assign({ dogId: dog.id }, e));
    const rs = ratingsOf(e);
    const rated = bs.filter((b) => typeof rs[b.id] === 'number').length;
    const C = 2 * Math.PI * 36;
    const pct = score == null ? 0 : score / 100;
    const col = score == null ? 'var(--surface-3)' : valueColor(pct);
    return '<div class="summary"><div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="42" cy="42" r="36" fill="none" stroke="' + col + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (C * pct).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
      '<div class="v num"><div>' + (score == null ? '–' : score) + '<small>score</small></div></div></div>' +
      '<div class="txt"><div class="word">' + scoreWord(score) + '</div><div class="meta">' + (rated ? rated + ' of ' + bs.length + ' rated' : 'Slide a behavior below to start today’s log') + '</div>' +
      '<div class="progress" aria-hidden="true"><i style="width:' + (bs.length ? Math.round(rated / bs.length * 100) : 0) + '%"></i></div></div></div>';
  }
  function behaviorCard(b, v) {
    const set = typeof v === 'number';
    const val = set ? v : 5;
    const g = (goodness(b, val) - 1) / 9;
    const st = set ? '--c:' + valueColor(g) + ';--p:' + ((val - 1) / 9 * 100).toFixed(1) + '%' : '';
    return '<div class="bcard' + (set ? '' : ' unset') + '" data-bid="' + esc(b.id) + '" style="' + st + '">' +
      '<div class="bhead"><span class="bemoji" aria-hidden="true">' + esc(b.emoji || '•') + '</span><span class="bname">' + esc(b.name) + '</span>' +
      (set && !S.readOnly ? '<button class="bclear" data-action="clear-rating" data-bid="' + esc(b.id) + '" aria-label="Clear ' + esc(b.name) + ' rating">Clear</button>' : '') +
      '<span class="bval num">' + (set ? val + '<small>/10</small>' : 'Not rated') + '</span></div>' +
      '<input type="range" class="slider" min="1" max="10" step="1"' + (S.readOnly ? ' disabled' : '') + ' value="' + val + '" id="r_' + esc(b.id) + '" data-rate="' + esc(b.id) + '" aria-label="' + esc(b.name) + ', 1 ' + esc(b.lowLabel) + ' to 10 ' + esc(b.highLabel) + '">' +
      '<div class="blabels"><span>' + esc(b.lowLabel || 'Low') + '</span><span>' + esc(b.highLabel || 'High') + '</span></div></div>';
  }

  // Entry editing: every change is a merge patch on the day's doc, so edits from two people merge.
  // patch fields: ratings {bid: n|null}, tags {name: true|false}, photos {id: ts|null}, notes, walkMinutes, weight, meals.
  function editEntry(dog, date, patch, opts) {
    const id = entryId(dog.id, date);
    const create = { dogId: dog.id, date: date, ratings: {}, notes: '', tags: {}, photos: {}, walkMinutes: null, weight: null, meals: null };
    if (S.entries[id] && (Array.isArray(S.entries[id].tags) || Array.isArray(S.entries[id].photoAssetIds))) {
      // Legacy array-shaped doc: rewrite once in map shape so later patches merge cleanly.
      const n = normalizeEntry(S.entries[id]);
      S.entries[id] = n;
      Store.put('entries', id, n);
    }
    const ok = Store.patch('entries', id, Object.assign({ updatedAt: Date.now() }, patch), create, opts && opts.now ? 0 : 700);
    if (ok) refreshSaveState();
    return ok;
  }
  function updateTodayLive(dog) {
    const e = getEntry(dog.id, S.date) || {};
    const sm = $('#summary');
    if (sm) sm.innerHTML = summaryInner(dog, e, dogBehaviors(dog.id));
  }

  /* =========================================================
     HISTORY
     ========================================================= */
  function renderHistory(dog) {
    const t = todayStr();
    const [y, m] = S.histMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const dim = new Date(y, m, 0).getDate();
    const lead = (first.getDay() - firstDayOfWeek + 7) % 7;
    const monthName = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const all = dogEntries(dog.id);
    const isCurMonth = S.histMonth === t.slice(0, 7);

    let h = '<header class="topbar"><h1>History</h1><span id="savestate" class="savestate"></span></header><div class="stack">';
    h += '<div class="search">' + I.search + '<input class="input" type="search" id="histSearch" placeholder="Search notes and tags" value="' + esc(S.search) + '" autocomplete="off" enterkeyhint="search">' + (S.search ? '<button class="clear" data-action="clear-search" aria-label="Clear search">' + I.x + '</button>' : '') + '</div>';

    if (!S.search) {
      h += '<section class="panel"><div class="cal-head"><button class="icon-btn" data-action="month" data-d="-1" aria-label="Previous month">' + I.chevL + '</button><div class="m">' + esc(monthName) + '</div>' +
        '<button class="icon-btn" data-action="month" data-d="1" aria-label="Next month"' + (isCurMonth ? ' disabled style="opacity:.3"' : '') + '>' + I.chevR + '</button></div><div class="cal">';
      for (let i = 0; i < 7; i++) {
        const wd = new Date(2024, 0, 7 + ((firstDayOfWeek + i) % 7)); // Jan 7 2024 is a Sunday
        h += '<div class="dow" aria-hidden="true">' + esc(wd.toLocaleDateString(undefined, { weekday: 'narrow' })) + '</div>';
      }
      for (let i = 0; i < lead; i++) h += '<div class="d pad"></div>';
      for (let d = 1; d <= dim; d++) {
        const dstr = y + '-' + pad(m) + '-' + pad(d);
        const e = getEntry(dog.id, dstr);
        const logged = isLogged(e);
        const sc = logged ? entryScore(e) : null;
        const cls = ['d'];
        if (!logged) cls.push('empty-day');
        if (dstr > t) cls.push('future');
        if (dstr === t) cls.push('today');
        const label = fmt(dstr, { weekday: 'long', month: 'long', day: 'numeric' }) + (logged ? (sc != null ? ', score ' + sc : ', logged') : ', no log');
        h += '<button class="' + cls.join(' ') + '" data-action="open-day" data-date="' + dstr + '" aria-label="' + esc(label) + '"' + (logged ? ' style="background:' + heatColor(sc) + '"' : '') + '>' + d + (logged && sc == null ? '<span class="dot"></span>' : '') + '</button>';
      }
      h += '</div><div class="legend"><span>Rough</span><span class="bar" style="background:linear-gradient(90deg,' + heatColor(0) + ',' + heatColor(50) + ',' + heatColor(100) + ')"></span><span>Great</span></div></section>';
    }

    let list = all;
    const q = S.search.trim().toLowerCase();
    if (q) list = all.filter((e) => (e.notes || '').toLowerCase().indexOf(q) >= 0 || tagsOf(e).some((tg) => tg.toLowerCase().indexOf(q) >= 0));
    h += '<section><div class="group-label"><span>' + (q ? plural(list.length, 'match', 'matches') : 'Recent logs') + '</span>' + (!q && all.length ? '<span class="aside">' + plural(all.length, 'day') + ' logged</span>' : '') + '</div>';
    if (!list.length) {
      h += '<div class="panel">' + (q ? '<div class="empty"><h3>No matches</h3><p>Nothing in your notes or tags matches “' + esc(S.search) + '”.</p></div>'
        : '<div class="empty"><div class="art">' + PAW + '</div><h3>No logs yet</h3><p>Your first day will show up here, colored by how it went.</p><button class="btn sm" data-action="goto-today">Log today</button></div>') + '</div>';
    } else {
      h += '<div class="panel rows">' + list.slice(0, S.histLimit).map((e) => entryRow(e, q)).join('') + '</div>';
      if (list.length > S.histLimit) h += '<div style="text-align:center;margin-top:8px"><button class="btn soft sm" data-action="more-history">Show more</button></div>';
    }
    h += '</section></div>';
    return h;
  }
  function highlight(text, q) {
    if (!q) return esc(text);
    const qe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return String(text).split(new RegExp('(' + qe + ')', 'ig')).map((part, i) => (i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part))).join('');
  }
  function entryRow(e, q) {
    const sc = entryScore(e);
    const t = todayStr();
    const dd = diffDays(e.date, t);
    const dl = dd === 0 ? 'Today' : dd === 1 ? 'Yesterday' : fmt(e.date, { weekday: 'short', month: 'short', day: 'numeric', year: pd(e.date).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
    let note = (e.notes || '').trim();
    if (q && note.toLowerCase().indexOf(q) > 60) { const i = note.toLowerCase().indexOf(q); note = '…' + note.slice(i - 30); }
    const tags = tagsOf(e).slice(0, 4);
    const ph = photosOf(e).slice(0, 4);
    const bl = byLine(e);
    return '<button class="entry" data-action="open-day" data-date="' + e.date + '"><span class="score num" style="background:' + heatColor(sc) + '">' + (sc == null ? '–' : sc) + '</span><span class="body"><span class="date">' + esc(dl) + '</span>' +
      (note ? '<span class="note">' + highlight(note, q) + '</span>' : '') +
      (tags.length ? '<span class="chips" style="gap:6px">' + tags.map((tg) => '<span class="chip static">' + highlight(tg, q) + '</span>').join('') + '</span>' : '') +
      (ph.length ? '<span class="thumbs">' + ph.map((id) => imgTag(id, '')).join('') + '</span>' : '') +
      (!note && !tags.length && !ph.length ? '<span class="note">' + scoreWord(sc) + '</span>' : '') +
      (bl ? '<span class="byline-s">' + esc(bl) + '</span>' : '') + '</span></button>';
  }

  /* =========================================================
     INSIGHTS
     ========================================================= */
  function rangeBounds(dogId, range, entries) {
    const end = todayStr();
    if (range === 'all') {
      const first = entries.length ? entries[entries.length - 1].date : end;
      return { start: first, end: end, days: diffDays(first, end) + 1 };
    }
    const n = Number(range);
    return { start: addDays(end, -(n - 1)), end: end, days: n };
  }
  function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }

  function renderInsights(dog) {
    const all = dogEntries(dog.id); // desc
    const bs = dogBehaviors(dog.id);
    const R = S.insRange;
    const rb = rangeBounds(dog.id, R, all);
    const inR = all.filter((e) => e.date >= rb.start && e.date <= rb.end).reverse(); // asc
    const prevStart = addDays(rb.start, -rb.days), prevEnd = addDays(rb.start, -1);
    let prev = all.filter((e) => e.date >= prevStart && e.date <= prevEnd);
    let cur = inR;
    let trendLabel = 'vs previous ' + rb.days + ' days';
    if (R === 'all') { const half = Math.floor(inR.length / 2); prev = inR.slice(0, half); cur = inR.slice(half); trendLabel = 'recent half vs earlier half'; }

    const segs = [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['all', 'All']];
    let h = '<header class="topbar"><h1>Insights</h1><span id="savestate" class="savestate"></span></header><div class="stack">';
    h += '<div class="seg" role="group" aria-label="Time range">' + segs.map(([v, l]) => '<button data-action="range" data-r="' + v + '" aria-pressed="' + (R === v) + '">' + l + '</button>').join('') + '</div>';

    if (all.length < 2) {
      h += '<div class="panel"><div class="empty"><div class="art">' + chartArt() + '</div><h3>Trends need a few days</h3><p>Log ' + esc(dog.name) + ' for ' + plural(Math.max(1, 2 - all.length), 'more day') + ' and the charts will start to fill in.</p><button class="btn sm" data-action="goto-today">Log today</button></div></div></div>';
      return h;
    }

    // Tiles
    const scored = inR.map((e) => ({ e: e, s: entryScore(e) })).filter((x) => x.s != null);
    const avgScore = avg(scored.map((x) => x.s));
    const prevScored = (R === 'all' ? prev : prev).map(entryScore).filter((x) => x != null);
    const curScored = (R === 'all' ? cur : inR).map(entryScore).filter((x) => x != null);
    const dScore = prevScored.length && curScored.length ? avg(curScored) - avg(prevScored) : null;
    const logged = inR.length;
    const best = scored.slice().sort((a, b) => b.s - a.s || (a.e.date < b.e.date ? 1 : -1))[0];
    const worst = scored.slice().sort((a, b) => a.s - b.s || (a.e.date < b.e.date ? 1 : -1))[0];
    const shortD = (d) => fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });

    h += '<div class="tiles">';
    h += '<div class="panel tile"><span class="k">Wellbeing</span><span class="v">' + (avgScore == null ? '–' : Math.round(avgScore)) + '<small>/100</small></span><span class="s">' + trendHtml(dScore, true, 3, ' pts') + '</span></div>';
    h += '<div class="panel tile"><span class="k">Logged</span><span class="v">' + logged + '<small>/' + rb.days + '</small></span><span class="s">' + Math.round(logged / rb.days * 100) + '% of days</span></div>';
    if (best && worst && scored.length > 1) {
      h += '<button class="panel tile" data-action="open-day" data-date="' + best.e.date + '"><span class="k">Best day</span><span class="v" style="color:var(--good)">' + best.s + '</span><span class="s">' + esc(shortD(best.e.date)) + '</span></button>';
      h += '<button class="panel tile" data-action="open-day" data-date="' + worst.e.date + '"><span class="k">Toughest day</span><span class="v" style="color:var(--bad)">' + worst.s + '</span><span class="s">' + esc(shortD(worst.e.date)) + '</span></button>';
    }
    h += '</div>';

    // Wellbeing chart
    if (scored.length >= 2) {
      const pts = scored.map((x) => ({ d: x.e.date, v: x.s }));
      h += '<section class="panel"><div class="chart-title"><span class="t">Wellbeing score</span><span class="s">daily, 0–100</span></div>' +
        lineChart('well', pts, rb, { min: 0, max: 100, ticks: [0, 50, 100], fmt: (v) => String(Math.round(v)), color: 'var(--accent)' }) + '</section>';
    } else if (inR.length) {
      h += '<section class="panel"><div class="empty"><h3>Rate a few behaviors</h3><p>The wellbeing score comes from your slider ratings.</p></div></section>';
    }

    // Consistency dots
    if (rb.days <= 120) {
      const set = new Set(inR.map((e) => e.date));
      let dots = '';
      for (let i = 0; i < rb.days; i++) { const d = addDays(rb.start, i); dots += '<i class="' + (set.has(d) ? 'on' : '') + '" title="' + esc(fmt(d, { month: 'short', day: 'numeric' })) + '"></i>'; }
      h += '<section class="panel"><div class="chart-title" style="padding-bottom:12px"><span class="t">Logging consistency</span><span class="s">' + plural(streakFor(dog.id), 'day') + ' streak</span></div><div class="dots" aria-label="' + logged + ' of ' + rb.days + ' days logged">' + dots + '</div></section>';
    }

    // Per-behavior
    h += '<section><div class="group-label"><span>Behaviors</span><span class="aside">' + esc(trendLabel) + '</span></div><div class="panel rows">';
    for (const b of bs) {
      const rv = (e) => ratingsOf(e)[b.id];
      const vals = inR.filter((e) => typeof rv(e) === 'number').map((e) => ({ d: e.date, v: rv(e) }));
      const a = avg(vals.map((x) => x.v));
      const c1 = avg(cur.filter((e) => typeof rv(e) === 'number').map(rv));
      const p1 = avg(prev.filter((e) => typeof rv(e) === 'number').map(rv));
      const delta = c1 != null && p1 != null ? c1 - p1 : null;
      h += '<div class="brow"><span class="nm"><span aria-hidden="true">' + esc(b.emoji) + '</span><span>' + esc(b.name) + '</span></span>' +
        '<span class="avg">' + (a == null ? '<span class="faint">–</span>' : '<b>' + a.toFixed(1) + '</b>') + '<span class="tr ' + trendCls(delta, b.higherIsBetter, 0.3) + '">' + trendArrow(delta, 0.3) + '</span></span>' +
        sparkline(vals, rb, b) + '</div>';
    }
    if (!bs.length) h += '<div class="empty"><p>No behaviors yet.</p></div>';
    h += '</div></section>';

    // Day-of-week
    if (bs.length) {
      if (!S.dowB || !bs.some((b) => b.id === S.dowB)) S.dowB = (bs.find((b) => /mood/i.test(b.name)) || bs[0]).id;
      const b = bs.find((x) => x.id === S.dowB);
      const sums = Array.from({ length: 7 }, () => []);
      for (const e of inR) { const v = ratingsOf(e)[b.id]; if (typeof v === 'number') sums[pd(e.date).getDay()].push(v); }
      h += '<section class="panel"><div class="chart-title"><span class="t">By day of week</span><span class="s">average ' + esc(b.name.toLowerCase()) + '</span></div>' +
        '<div class="hwrap"><div class="hscroll" id="dowScroll">' + bs.map((x) => '<button class="chip" data-action="dow" data-bid="' + esc(x.id) + '" aria-pressed="' + (x.id === S.dowB) + '">' + esc(x.emoji + ' ' + x.name) + '</button>').join('') + '</div></div>' +
        dowChart(sums, b) + '</section>';
    }

    // Tags
    const tc = {};
    for (const e of inR) for (const tg of tagsOf(e)) tc[tg] = (tc[tg] || 0) + 1;
    const top = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 6);
    h += '<section class="panel"><div class="chart-title"><span class="t">Most frequent tags</span><span class="s">days tagged</span></div>';
    if (top.length) {
      const mx = top[0][1];
      h += '<div class="tagbars">' + top.map(([tg, n]) => '<div class="tagbar"><div class="lbl"><span>' + esc(tg) + '</span><div class="track"><i style="width:' + (n / mx * 100).toFixed(1) + '%"></i></div></div><span class="c">' + n + '</span></div>').join('') + '</div>';
    } else h += '<p class="small muted" style="padding:10px 16px 16px;margin:0">No tags in this range yet. Tap tags on the Today screen to see patterns here.</p>';
    h += '</section>';

    // Weight
    const wts = inR.filter((e) => typeof e.weight === 'number').map((e) => ({ d: e.date, v: e.weight }));
    if (wts.length >= 1) {
      const unit = dog.weightUnit || 'kg';
      const vs = wts.map((x) => x.v);
      let mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
      const span = Math.max(mx - mn, mx * 0.04, 0.5);
      mn = Math.max(0, mn - span * 0.35); mx = mx + span * 0.35;
      const step = niceStep((mx - mn) / 2);
      mn = Math.floor(mn / step) * step; mx = Math.ceil(mx / step) * step;
      const ticks = []; for (let v = mn; v <= mx + 1e-9; v += step) ticks.push(round1(v));
      const last = wts[wts.length - 1], firstW = wts[0];
      const dW = wts.length > 1 ? round1(last.v - firstW.v) : null;
      h += '<section class="panel"><div class="chart-title"><span class="t">Weight</span><span class="s">' + last.v + ' ' + esc(unit) + (dW != null ? ' · ' + (dW > 0 ? '+' : '') + dW + ' in range' : '') + '</span></div>' +
        (wts.length >= 2 ? lineChart('weight', wts, rb, { min: mn, max: mx, ticks: ticks, fmt: (v) => round1(v) + ' ' + unit, color: 'var(--honey)', tickFmt: (v) => String(round1(v)) }) : '<p class="small muted" style="padding:8px 16px 16px;margin:0">Log weight on another day to see the trend.</p>') + '</section>';
    }
    h += '</div>';
    return h;
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  function trendArrow(d, thr) {
    if (d == null) return '';
    if (Math.abs(d) < thr) return '→ steady';
    return (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1);
  }
  function trendCls(d, hib, thr) {
    if (d == null || Math.abs(d) < thr) return 'flat';
    return (d > 0) === !!hib ? 'good' : 'bad';
  }
  function trendHtml(d, hib, thr, unit) {
    if (d == null) return 'No earlier data to compare';
    if (Math.abs(d) < thr) return '<span class="tr flat">→ Steady</span>';
    return '<span class="tr ' + trendCls(d, hib, thr) + '">' + (d > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(d)) + (unit || '') + '</span>';
  }
  function chartArt() {
    return '<svg viewBox="0 0 84 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 64 30 44l14 10 26-30" /><circle cx="70" cy="24" r="5" fill="currentColor"/></svg>';
  }

  const CHARTS = {};
  function lineChart(id, pts, rb, o) {
    const W = 340, H = 170, pl = 36, pr = 12, pt = 30, pb = 26;
    const iw = W - pl - pr, ih = H - pt - pb;
    const days = Math.max(1, rb.days - 1);
    const X = (d) => pl + (diffDays(rb.start, d) / days) * iw;
    const Y = (v) => pt + ih - ((v - o.min) / (o.max - o.min || 1)) * ih;
    const P = pts.map((p) => ({ x: X(p.d), y: Y(p.v), d: p.d, v: p.v }));
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(id === 'well' ? 'Wellbeing score over time' : 'Weight over time') + '">';
    s += '<defs><linearGradient id="g_' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + o.color + '" stop-opacity=".22"/><stop offset="1" stop-color="' + o.color + '" stop-opacity="0"/></linearGradient></defs>';
    for (const tv of o.ticks) {
      const y = Y(tv).toFixed(1);
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"' + (tv === o.ticks[0] ? '' : ' stroke-dasharray="3 4"') + '/>';
      s += '<text x="' + (pl - 8) + '" y="' + y + '" dy="4" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--font-body)">' + esc(o.tickFmt ? o.tickFmt(tv) : String(tv)) + '</text>';
    }
    const xl = [rb.start, rb.end];
    if (rb.days > 6) xl.splice(1, 0, addDays(rb.start, Math.round((rb.days - 1) / 2)));
    xl.forEach((d, i) => {
      s += '<text x="' + X(d).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === xl.length - 1 ? 'end' : 'middle') + '" font-size="11" fill="var(--ink-3)" font-family="var(--font-body)">' + esc(fmt(d, { month: 'short', day: 'numeric' })) + '</text>';
    });
    const line = P.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    const base = (pt + ih).toFixed(1);
    s += '<path d="' + line + ' L' + P[P.length - 1].x.toFixed(1) + ' ' + base + ' L' + P[0].x.toFixed(1) + ' ' + base + ' Z" fill="url(#g_' + id + ')"/>';
    s += '<path d="' + line + '" fill="none" stroke="' + o.color + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>';
    if (P.length <= 31) P.forEach((p) => { s += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.6" fill="' + o.color + '"/>'; });
    const L = P[P.length - 1];
    s += '<circle cx="' + L.x.toFixed(1) + '" cy="' + L.y.toFixed(1) + '" r="5" fill="' + o.color + '" stroke="var(--surface)" stroke-width="2.5"/>';
    s += '<text x="' + Math.min(L.x, W - pr).toFixed(1) + '" y="' + (L.y - 11).toFixed(1) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">' + esc(o.fmt(L.v)) + '</text>';
    s += '<g class="hover" opacity="0"><line x1="0" x2="0" y1="' + pt + '" y2="' + base + '" stroke="var(--ink-3)" stroke-width="1"/><circle r="5.5" fill="' + o.color + '" stroke="var(--surface)" stroke-width="2.5"/></g>';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" class="hit"/></svg>';
    CHARTS[id] = { P: P, W: W, fmt: o.fmt };
    return '<div class="chart" data-chart="' + id + '">' + s + '<div class="tip"></div></div>';
  }
  function bindChart(el) {
    const c = CHARTS[el.getAttribute('data-chart')];
    if (!c) return;
    const svg = el.querySelector('svg'), g = svg.querySelector('.hover'), tip = el.querySelector('.tip');
    const ln = g.querySelector('line'), dot = g.querySelector('circle');
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * c.W;
      let best = c.P[0], bd = Infinity;
      for (const p of c.P) { const dd = Math.abs(p.x - x); if (dd < bd) { bd = dd; best = p; } }
      g.setAttribute('opacity', '1');
      ln.setAttribute('x1', best.x); ln.setAttribute('x2', best.x);
      dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y);
      tip.textContent = fmt(best.d, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + c.fmt(best.v);
      const px = best.x / c.W * r.width + (svg.getBoundingClientRect().left - el.getBoundingClientRect().left);
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = clamp(px, half, el.clientWidth - half) + 'px';
      tip.classList.add('on');
    };
    const leave = () => { g.setAttribute('opacity', '0'); tip.classList.remove('on'); };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', leave);
    svg.addEventListener('pointercancel', leave);
  }
  function sparkline(vals, rb, b) {
    const W = 84, H = 30, p = 3;
    if (vals.length < 2) return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="84" height="30" aria-hidden="true"><line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="var(--line)" stroke-dasharray="2 3"/></svg>';
    const days = Math.max(1, rb.days - 1);
    const X = (d) => p + diffDays(rb.start, d) / days * (W - 2 * p);
    const Y = (v) => H - p - (v - 1) / 9 * (H - 2 * p);
    const d = vals.map((v, i) => (i ? 'L' : 'M') + X(v.d).toFixed(1) + ' ' + Y(v.v).toFixed(1)).join(' ');
    const L = vals[vals.length - 1];
    const col = valueColor((goodness(b, L.v) - 1) / 9);
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="84" height="30" aria-hidden="true"><line x1="0" x2="' + W + '" y1="' + Y(5.5).toFixed(1) + '" y2="' + Y(5.5).toFixed(1) + '" stroke="var(--line)" stroke-dasharray="2 3"/><path d="' + d + '" fill="none" stroke="var(--ink-2)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + X(L.d).toFixed(1) + '" cy="' + Y(L.v).toFixed(1) + '" r="3.5" fill="' + col + '" stroke="var(--surface)" stroke-width="1.5"/></svg>';
  }
  function dowChart(sums, b) {
    const W = 340, H = 150, pt = 22, pb = 24, pl = 8, pr = 8;
    const ih = H - pt - pb, colW = (W - pl - pr) / 7, bw = Math.min(30, colW - 12);
    let s = '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Average ' + esc(b.name) + ' by weekday">';
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="var(--line)"/>';
    for (let i = 0; i < 7; i++) {
      const wd = (firstDayOfWeek + i) % 7;
      const a = avg(sums[wd]);
      const cx = pl + colW * i + colW / 2;
      const label = new Date(2024, 0, 7 + wd).toLocaleDateString(undefined, { weekday: 'short' });
      if (a != null) {
        const bh = Math.max(4, (a / 10) * ih);
        const y = pt + ih - bh;
        const col = valueColor((goodness(b, a) - 1) / 9);
        s += '<path d="M' + (cx - bw / 2) + ' ' + (pt + ih) + ' V' + (y + 4) + ' q0 -4 4 -4 h' + (bw - 8) + ' q4 0 4 4 V' + (pt + ih) + ' Z" fill="' + col + '"><title>' + esc(label + ': ' + a.toFixed(1) + ' (' + plural(sums[wd].length, 'day') + ')') + '</title></path>';
        s += '<text x="' + cx + '" y="' + (y - 6) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">' + a.toFixed(1) + '</text>';
      } else {
        s += '<text x="' + cx + '" y="' + (pt + ih - 6) + '" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--font-body)">–</text>';
      }
      s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--font-body)">' + esc(label) + '</text>';
    }
    return s + '</svg></div>';
  }

  /* =========================================================
     DOG PROFILE
     ========================================================= */
  function ageParts(birth, today) {
    // Whole months via a month-anniversary clamped to the month's length (Jan 31 -> Feb 28, Feb 29 -> Feb 28), then days.
    const b = pd(birth), t = pd(today);
    const anchor = (mo) => { const yy = b.getFullYear() + Math.floor((b.getMonth() + mo) / 12), mm = (b.getMonth() + mo) % 12; return new Date(yy, mm, Math.min(b.getDate(), new Date(yy, mm + 1, 0).getDate())); };
    let months = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
    if (months > 0 && anchor(months) > t) months--;
    if (months < 0) months = 0;
    const d = Math.max(0, Math.round((t - anchor(months)) / 864e5));
    return { y: Math.floor(months / 12), m: months % 12, d: d };
  }
  function nextAnniversary(dateStr, today) {
    const b = pd(dateStr), t = pd(today);
    const mk = (yr) => { const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0; const day = b.getMonth() === 1 && b.getDate() === 29 && !leap ? 28 : b.getDate(); return new Date(yr, b.getMonth(), day); };
    let n = mk(t.getFullYear());
    if (n < t || n.getFullYear() <= b.getFullYear()) n = mk(Math.max(t.getFullYear(), b.getFullYear()) + 1);
    const prevA = mk(n.getFullYear() - 1);
    return { date: ds(n), days: diffDays(today, ds(n)), years: n.getFullYear() - b.getFullYear(), sinceLast: diffDays(ds(prevA), today), span: diffDays(ds(prevA), ds(n)) };
  }
  function humanYears(ageYears, size) {
    const r = (SIZES[size] || SIZES.medium).rate;
    if (ageYears <= 1) return ageYears * r[0];
    if (ageYears <= 2) return r[0] + (ageYears - 1) * (r[1] - r[0]);
    return r[1] + (ageYears - 2) * r[2];
  }
  function lifeStage(ageYears, size) {
    if (ageYears < 1) return 'Puppy';
    if (ageYears < 2) return 'Adolescent';
    if (ageYears >= (SIZES[size] || SIZES.medium).senior) return 'Senior';
    return 'Adult';
  }
  function partsText(p) {
    const out = [];
    if (p.y) out.push('<b>' + p.y + '</b> <span>' + (p.y === 1 ? 'yr' : 'yrs') + '</span>');
    if (p.m || p.y) out.push('<b>' + p.m + '</b> <span>' + (p.m === 1 ? 'mo' : 'mos') + '</span>');
    out.push('<b>' + p.d + '</b> <span>' + (p.d === 1 ? 'day' : 'days') + '</span>');
    return out.join(' ');
  }
  function plainParts(p) {
    const out = [];
    if (p.y) out.push(plural(p.y, 'year'));
    if (p.m) out.push(plural(p.m, 'month'));
    if (!p.y && (p.d || !p.m)) out.push(plural(p.d, 'day'));
    return out.join(', ');
  }

    return { app: 'pawlog', version: 2, exportedAt: new Date().toISOString(), dogs: S.dogs, behaviors: S.behaviors, entries: S.entries, events: S.events, photos: S.photos, photoFull: full, settings: { app: { quickTags: settings().quickTags } } };

  function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv() {
    const names = [];
    for (const b of Object.values(S.behaviors).sort((a, c) => (a.order || 0) - (c.order || 0))) if (b && names.indexOf(b.name) < 0) names.push(b.name);
    const head = ['date', 'dog'].concat(names, ['wellbeing_score', 'walk_minutes', 'weight', 'weight_unit', 'meals', 'tags', 'notes', 'photo_count']);
    const rows = [head.map(csvCell).join(',')];
    const es = Object.values(S.entries).filter(isLogged).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    for (const e of es) {
      const dog = S.dogs[e.dogId];
      const byName = {};
      for (const [bid, v] of Object.entries(ratingsOf(e))) { const b = S.behaviors[bid]; if (b) byName[b.name] = v; }
      rows.push([e.date, dog ? dog.name : ''].concat(names.map((n) => byName[n]), [entryScore(e), e.walkMinutes, e.weight, dog ? dog.weightUnit : '', e.meals, tagsOf(e).join('; '), e.notes, photosOf(e).length]).map(csvCell).join(','));
    }
    return rows.join('\r\n');
  }
  async function saveFile(filename, text, mime) {
    if (hasClaude()) {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: filename, data: text }); toast('Saved ' + filename); return; }
        catch (e) {
          const c = e && e.code;
          if (c === 'declined') return;
          if (c === 'rate_limited') { toast('A save prompt is already open.'); return; }
          if (c === 'too_large') { toast('The file is too large to save here.', true); return; }
        }
      }
      showTextExport(filename, text);
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Downloaded ' + filename);
    } catch (e) { showTextExport(filename, text); }
  }

  async function importJson(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast("That file isn't valid JSON.", true); return; }
    if (!data || data.app !== 'pawlog' || typeof data.dogs !== 'object') { toast("That doesn't look like a Pawlog backup.", true); return; }
    const nd = Object.keys(data.dogs || {}).length, ne = Object.keys(data.entries || {}).length;
    const ch = await confirmDialog({ title: 'Import backup?', body: plural(nd, 'dog') + ' and ' + plural(ne, 'log entry', 'log entries') + '. Matching records are replaced; everything else is kept.', ok: 'Import' });
    if (ch !== 1) return;
    let n = 0;
    const okId = (id) => /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id);
    const fullSrc = (data.photoFull && typeof data.photoFull === 'object') ? data.photoFull : {};
    // Photos first, so entries never point at missing images.
    for (const [id, v] of Object.entries(data.photos || {})) {
      if (!v || typeof v !== 'object' || !okId(id)) continue;
      const thumbSrc = typeof v.thumb === 'string' ? v.thumb : (typeof v.d === 'string' ? v.d : '');
      if (!/^data:image\//.test(thumbSrc)) continue;
      const big = typeof fullSrc[id] === 'string' && /^data:image\//.test(fullSrc[id]) ? fullSrc[id] : (typeof v.d === 'string' ? v.d : '');
      const meta = { dogId: v.dogId || null, date: v.date || null, thumb: thumbSrc, createdAt: Number(v.createdAt) || Date.now(), createdBy: v.createdBy || S.me || null };
      if (big && big !== thumbSrc) {
        S.photoFull[id] = big;
        if (S.mode === 'db') { try { await withRetry(() => ROOT.collection('photofull').doc(id).set({ dataUrl: big, dogId: meta.dogId, createdAt: meta.createdAt })); } catch (e) { /* thumb still shows */ } }
        else localSave('photoFull');
      }
      Store.put('photos', id, meta); n++;
    }
    for (const col of ['dogs', 'behaviors', 'entries', 'events']) {
      const src = data[col];
      if (!src || typeof src !== 'object') continue;
      for (const [id, v] of Object.entries(src)) {
        if (!v || typeof v !== 'object' || !okId(id)) continue;
        Store.put(col, id, col === 'entries' ? normalizeEntry(clone(v)) : clone(v)); n++;
      }
    }
    const qt = data.settings && data.settings.app && Array.isArray(data.settings.app.quickTags) ? data.settings.app.quickTags.filter((x) => typeof x === 'string').slice(0, 60) : null;
    if (qt) saveQuickTags(qt);
    if (!S.dogs[settings().activeDogId] && sortedDogs()[0]) setActiveDog(sortedDogs()[0].id);
    toast('Imported ' + plural(n, 'record'));
    render();
  }
