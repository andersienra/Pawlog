    { const g = $('#photoGrid'); if (g) g.outerHTML = photoGridHtml(getEntry(dog.id, S.date) || {}); }
    for (const f of files) {
      const id = await savePhoto(f, dog.id, date);
      S.uploading = Math.max(0, S.uploading - 1);
      if (id) { const pp = {}; pp[id] = Date.now(); editEntry(dog, date, { photos: pp }, { now: true }); }
      if (S.view === 'today') { const g = $('#photoGrid'); if (g) g.outerHTML = photoGridHtml(getEntry(dog.id, S.date) || {}); }
    }
  }

  document.addEventListener('submit', (e) => {
    const f = e.target;
    const kind = f.dataset && f.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === 'auth') { if (!AUTH.busy) submitAuth(f); return; }
    if (kind === 'dog-new' || kind === 'dog-add') {
      const d = readDogForm(f);
      if (!d.name) { toast('Give your dog a name first.', true); $('#f_name', f).focus(); return; }
      flushPending();
      createDog(d);
      closeSheet();
      S.date = todayStr();
      toast('Welcome, ' + d.name + '!');
      go('today', { top: true });
    } else if (kind === 'dog-edit') {
      const base = S.dogs[f.dataset.id]; if (!base) return;
      const d = readDogForm(f, base);
      if (!d.name) { toast('Name can’t be empty.', true); return; }
      const prevAv = base.avatarAssetId;
      d.avatarAssetId = formAvatar;
      Store.put('dogs', d.id, d);
      if (prevAv && prevAv !== formAvatar) releasePhoto(prevAv);
      closeSheet(); render(); toast('Saved');
    } else if (kind === 'event') {
      const fd = new FormData(f);
      const dog = curDog();
      const id = f.dataset.id || genId('e');
      const type = String(fd.get('type') || 'vet');
      const ev = Object.assign({}, S.events[id] || {}, {
        id: id, dogId: (S.events[id] && S.events[id].dogId) || dog.id, type: type,
        title: String(fd.get('title') || '').trim() || EVENT_TYPES[type].label,
        date: isDate(fd.get('date')) ? fd.get('date') : todayStr(),
        nextDue: isDate(fd.get('nextDue')) ? fd.get('nextDue') : null,
        notes: String(fd.get('notes') || '')
      });
      Store.put('events', id, ev);
      closeSheet(); render(); toast(f.dataset.id ? 'Record saved' : 'Record added');
    } else if (kind === 'behavior') {
      const fd = new FormData(f);
      const dog = curDog();
      const id = f.dataset.id || genId('b');
      const prev = S.behaviors[id];
      const name = String(fd.get('name') || '').trim();
      if (!name) { toast('Give the behavior a name.', true); return; }
      const b = Object.assign({}, prev || { dogId: dog.id, archived: false, order: Math.max(-1, ...dogBehaviors(dog.id).map((x) => x.order || 0)) + 1 }, {
        id: id, name: name, emoji: String(fd.get('emoji') || '').trim() || '🐾',
        lowLabel: String(fd.get('lowLabel') || '').trim() || 'Low', highLabel: String(fd.get('highLabel') || '').trim() || 'High',
        higherIsBetter: fd.get('higherIsBetter') === 'on'
      });
      Store.put('behaviors', id, b);
      closeSheet(); render(); toast(prev ? 'Saved' : name + ' added');
    } else if (kind === 'tag-new' || kind === 'quicktag') {
      const v = String(new FormData(f).get('tag') || '').trim().replace(/\s+/g, ' ');
      if (!v) return;
      if (S.readOnly) { canWrite(); return; }
      const q = settings().quickTags;
      if (q.indexOf(v) < 0) { q.push(v); saveQuickTags(q); }
      if (kind === 'tag-new') {
        const dog = curDog();
        const t = {}; t[v] = Date.now();
        editEntry(dog, S.date, { tags: t });
        S.addingTag = false;
        render();
      } else { render(); const i = $('#qtNew'); if (i) i.focus(); }
    }
  });

  /* =========================================================
     Boot
     ========================================================= */
  async function init() {
    applyTheme(lsGet(LS_THEME) || 'system');
    ensureHeadMeta();
    const fbCfg = (typeof window.__PAWLOG_FIREBASE_CONFIG !== 'undefined') ? window.__PAWLOG_FIREBASE_CONFIG : FIREBASE_CONFIG;
    if (!hasClaude()) { if (fbCfg) startFirebase(fbCfg); else startLocal('standalone'); return; }
    let db = null, user = null;
    try {
      const r = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('user').catch(() => null)]);
      db = r[0]; user = r[1];
    } catch (e) { db = null; }
    if (!db) { if (fbCfg) startFirebase(fbCfg); else startLocal('nodb'); return; }
    S.user = user || null;
    let uid = null;
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    S.me = uid;
    // Write permission on the shared logbook: true/false from the platform, or null (unknown → let a refused write decide).
    let cw = null;
    try { cw = user ? await user.can('data.write') : null; } catch (e) { cw = null; }
    S.canWrite = cw;
    if (cw === false) { S.readOnly = true; document.body.classList.add('ro'); }
    startDb(db);
    if (uid) wantNames([uid]);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

</body></html>
